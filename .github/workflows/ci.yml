name: StockIQ CI Pipeline

on:
  push:
    branches: [ main, migrate ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Node.js + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build Backend
        run: npm run build

      - name: Export OpenAPI Specification & Check Drift
        run: |
          npm run export:openapi
          git diff --exit-code openapi.json || (echo "OpenAPI spec is out of sync. Please run 'npm run export:openapi' and commit." && exit 1)

      - name: Run Backend Unit & Integration Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stockiq

  frontend-ci:
    name: Frontend CI (Angular + Tailwind)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Sync API Contracts
        run: npm run api:sync

      - name: Build Angular Application
        run: npm run build

      - name: Run Frontend Tests
        run: npm test -- --run
